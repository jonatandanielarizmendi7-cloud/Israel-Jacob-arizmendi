
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Israel Jacob Arizmendi</title>
</head>

<body>
  <h1>Israel Jacob Arizmendi</h1>

  <p>Hola. Soy Israel Jacob Arizmendi, tu inteligencia artificial.</p>

  <button id="boton">🎙️ Hablar conmigo</button>

  <p id="resultado">Toca el botón y habla.</p>

  <script>
    const URL_APPS_SCRIPT = "PEGA_AQUI_TU_URL_DE_APPS_SCRIPT"; https://script.google.com/macros/s/AKfycbylrv7HOXCQ8uaOZcFmuvAg9FvNQrVYK8UTHvCEm-sXx6zrwl5FnWTRONOBOaqb5s2t/exec
    const boton = document.getElementById("boton");
    const resultado = document.getElementById("resultado");

    const Reconocimiento =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    function hablar(texto) {
      const mensaje = new SpeechSynthesisUtterance(texto);
      mensaje.lang = "es-ES";
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(mensaje);
    }

    boton.onclick = function () {

      if (!Reconocimiento) {
        resultado.textContent =
          "Este navegador no permite reconocimiento de voz.";
        hablar("Este navegador no permite reconocimiento de voz.");
        return;
      }

      const reconocimiento = new Reconocimiento();

      reconocimiento.lang = "es-ES";
      reconocimiento.continuous = false;
      reconocimiento.interimResults = false;

      resultado.textContent = "🎤 Preparando el micrófono...";

      reconocimiento.onstart = function () {
        resultado.textContent =
          "🎤 Te estoy escuchando. Habla ahora.";
      };

      reconocimiento.onresult = async function (event) {

        const texto =
          event.results[0][0].transcript;

        resultado.textContent =
          "Tú dijiste: " + texto +
          "\n\n🤖 IJA está pensando...";

        try {

          const respuesta = await fetch(URL_APPS_SCRIPT, {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              pregunta: texto
            })
          });

          const datos = await respuesta.json();

          resultado.textContent =
            "Tú dijiste: " + texto +
            "\n\n🤖 IJA: " + datos.respuesta;

          hablar(datos.respuesta);

        } catch (error) {

          resultado.textContent =
            "No pude conectar con IJA. Intenta nuevamente.";

          console.log("Error de conexión:", error);
        }
      };

      reconocimiento.onerror = function (event) {
        resultado.textContent =
          "Error del micrófono: " + event.error;
      };

      try {
        reconocimiento.start();
      } catch (error) {
        resultado.textContent =
          "No se pudo iniciar el micrófono.";
      }
    };
  </script>
</body>
</html>
