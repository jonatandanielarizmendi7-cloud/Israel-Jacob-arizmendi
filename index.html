<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>IJA — Núcleo Operativo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101827;
      color: #f1f5f9;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 760px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 18px;
    }

    header {
      text-align: center;
      padding: 16px 8px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 27px;
    }

    header p {
      color: #a8b7cc;
      margin: 0;
    }

    .estado {
      margin: 12px 0;
      padding: 12px;
      border: 1px solid #334155;
      border-radius: 12px;
      color: #cbd5e1;
      text-align: center;
      font-size: 14px;
    }

    #chat {
      flex: 1;
      min-height: 280px;
      max-height: 58vh;
      overflow-y: auto;
      padding: 12px 0;
    }

    .mensaje {
      padding: 13px;
      border-radius: 13px;
      margin: 10px 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .usuario {
      background: #243b60;
      margin-left: 25px;
    }

    .ija {
      background: #1e293b;
      margin-right: 25px;
    }

    .error {
      background: #49242b;
      color: #ffe0e0;
    }

    .autor {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .controles {
      display: flex;
      gap: 9px;
      align-items: stretch;
      padding-top: 12px;
    }

    textarea {
      flex: 1;
      min-width: 0;
      min-height: 52px;
      max-height: 140px;
      resize: vertical;
      padding: 13px;
      border: 1px solid #475569;
      border-radius: 12px;
      background: #1e293b;
      color: white;
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 15px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    .secundario {
      background: #334155;
    }

    .acciones {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .nota {
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.5;
      margin-top: 15px;
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <h1>IJA</h1>
      <p>Israel Jacob Arizmendi</p>
      <p>Núcleo Operativo</p>
    </header>

    <div id="estado" class="estado">
      Preparado para comprobar la conexión.
    </div>

    <section id="chat" aria-live="polite">
      <div class="mensaje ija">
        <span class="autor">IJA</span>
        Hola. Soy IJA, Israel Jacob Arizmendi.
        Estoy listo para comunicarme contigo.
      </div>
    </section>

    <form id="formulario">
      <div class="controles">
        <textarea
          id="inputTexto"
          placeholder="Escribe tu mensaje..."
          aria-label="Mensaje para IJA"
          required
        ></textarea>

        <button id="btnEnviar" type="submit">
          Enviar
        </button>
      </div>
    </form>

    <div class="acciones">
      <button
        id="btnComprobar"
        class="secundario"
        type="button"
      >
        Comprobar conexión
      </button>

      <button
        id="btnVoz"
        class="secundario"
        type="button"
      >
        Leer respuesta
      </button>

      <button
        id="btnDetener"
        class="secundario"
        type="button"
      >
        Detener voz
      </button>
    </div>

    <p class="nota">
      La conexión depende de la configuración del servidor.
      No introduzcas contraseñas ni claves secretas en el chat.
    </p>
  </main>

  <script>
    "use strict";

    // IMPORTANTE:
    // Sustituye esta dirección por la URL /exec
    // de tu implementación web actual de Apps Script.
    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycbzhC5eh-EuPnUcLTtX9Kamhi3oJ-Jibex495Oonqheflxl_nEiun0mir9nit7esFqRY/exec";

    const estado = document.getElementById("estado");
    const chat = document.getElementById("chat");
    const formulario = document.getElementById("formulario");
    const inputTexto = document.getElementById("inputTexto");
    const btnEnviar = document.getElementById("btnEnviar");
    const btnComprobar = document.getElementById("btnComprobar");
    const btnVoz = document.getElementById("btnVoz");
    const btnDetener = document.getElementById("btnDetener");

    let enviando = false;
    let ultimaRespuesta = "";

    function agregarAlChat(autor, texto, clase) {
      const mensaje = document.createElement("div");
      mensaje.className = "mensaje " + clase;

      const nombre = document.createElement("span");
      nombre.className = "autor";
      nombre.textContent = autor;

      const contenido = document.createElement("span");
      contenido.textContent = String(texto);

      mensaje.appendChild(nombre);
      mensaje.appendChild(contenido);
      chat.appendChild(mensaje);
      chat.scrollTop = chat.scrollHeight;

      return mensaje;
    }

    function hablarTexto(texto) {
      if (!("speechSynthesis" in window)) {
        estado.textContent =
          "La lectura por voz no está disponible en este navegador.";
        return;
      }

      window.speechSynthesis.cancel();

      const voz = new SpeechSynthesisUtterance(String(texto));
      voz.lang = "es-ES";
      voz.rate = 1;
      voz.pitch = 1;

      window.speechSynthesis.speak(voz);
    }

    function llamarMotor(mensaje) {
      return new Promise(function(resolve, reject) {
        if (
          !URL_APPS_SCRIPT ||
          !URL_APPS_SCRIPT.startsWith("https://script.google.com/") ||
          !URL_APPS_SCRIPT.endsWith("/exec")
        ) {
          reject(new Error(
            "Falta configurar la URL /exec de Apps Script."
          ));
          return;
        }

        const callback = "ija_cb_" + Date.now() +
          "_" + Math.floor(Math.random() * 100000);

        const script = document.createElement("script");
        let terminado = false;

        const temporizador = setTimeout(function() {
          finalizar();
          reject(new Error(
            "Tiempo de espera agotado. Comprueba Apps Script."
          ));
        }, 30000);

        function finalizar() {
          if (terminado) return;
          terminado = true;
          clearTimeout(temporizador);
          script.remove();
          delete window[callback];
        }

        window[callback] = function(data) {
          finalizar();
          resolve(data);
        };

        const parametros = new URLSearchParams();
        parametros.set("callback", callback);

        if (mensaje) {
          parametros.set("text", mensaje);
        }

        script.onerror = function() {
          finalizar();
          reject(new Error(
            "No se pudo cargar la respuesta de Apps Script."
          ));
        };

        script.src =
          URL_APPS_SCRIPT + "?" + parametros.toString();

        document.body.appendChild(script);
      });
    }

    async function comprobarConexion() {
      estado.textContent = "Comprobando servicio...";
      btnComprobar.disabled = true;

      try {
        const data = await llamarMotor("");

        if (!data || !data.ok) {
          throw new Error(
            data && data.error
              ? data.error
              : "El servidor no confirmó la conexión."
          );
        }

        estado.textContent = "Servicio IJA disponible";
      } catch (error) {
        estado.textContent = "No se pudo comprobar la conexión";
        agregarAlChat("Sistema", error.message, "error");
        console.error("Comprobación:", error);
      } finally {
        btnComprobar.disabled = false;
      }
    }

    async function enviarAProtegido(mensaje) {
      mensaje = String(mensaje || "").trim();

      if (!mensaje || enviando) return;

      agregarAlChat("Tú", mensaje, "usuario");

      const cargando = agregarAlChat(
        "IJA",
        "Estoy procesando tu mensaje...",
        "ija"
      );

      enviando = true;
      btnEnviar.disabled = true;
      estado.textContent = "Esperando respuesta del motor...";

      try {
        const data = await llamarMotor(mensaje);

        if (!data || !data.ok) {
          throw new Error(
            data && data.error
              ? data.error
              : "El motor no pudo responder."
          );
        }

        if (!data.reply) {
          throw new Error("El motor no devolvió una respuesta.");
        }

        ultimaRespuesta = String(data.reply);
        cargando.remove();

        agregarAlChat("IJA", ultimaRespuesta, "ija");
        estado.textContent = "Respuesta recibida";
        hablarTexto(ultimaRespuesta);

      } catch (error) {
        cargando.remove();

        agregarAlChat(
          "IJA",
          "No pude completar la solicitud. Detalle: " +
            error.message,
          "error"
        );

        estado.textContent = "No se pudo completar la solicitud";
        console.error("Error de conexión:", error);

      } finally {
        enviando = false;
        btnEnviar.disabled = false;
        inputTexto.focus();
      }
    }

    formulario.addEventListener("submit", function(event) {
      event.preventDefault();
      enviarAProtegido(inputTexto.value);
      inputTexto.value = "";
    });

    btnComprobar.addEventListener("click", comprobarConexion);

    btnVoz.addEventListener("click", function() {
      if (ultimaRespuesta) {
        hablarTexto(ultimaRespuesta);
      } else {
        estado.textContent = "Todavía no hay respuestas para leer.";
      }
    });

    btnDetener.addEventListener("click", function() {
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
      estado.textContent = "Lectura por voz detenida";
    });
  </script>
</body>
      </html>
