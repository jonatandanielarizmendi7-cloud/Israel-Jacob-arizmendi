<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Israel Jacob Arizmendi</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
      margin: 0;
      background: #f5f5f5;
      color: #222;
    }

    h1 {
      margin-bottom: 10px;
    }

    button {
      padding: 15px 25px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #222;
      color: white;
    }

    button:disabled {
      opacity: 0.6;
    }

    #resultado {
      margin-top: 25px;
      padding: 20px;
      background: white;
      border-radius: 12px;
      min-height: 50px;
    }
  </style>
</head>

<body>

  <h1>Israel Jacob Arizmendi</h1>

  <p>Hola. Soy Israel Jacob Arizmendi, tu inteligencia artificial.</p>

  <button id="hablar">🎙️ Hablar conmigo</button>

  <div id="resultado">
    Toca el botón y habla.
  </div>

  <script>

    const URL_APPS_SCRIPT =
  "https://script.google.com/macros/s/AKfycbye3sx1VouZkoUsg3ixkIgvEbpKbiNqLs_tkA9IicNpq74PHJM4baP4jL6dWUqj7n-l/exec";";

    const boton = document.getElementById("hablar");
    const resultado = document.getElementById("resultado");

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

      resultado.textContent =
        "Este navegador no admite reconocimiento de voz.";

    } else {

      const reconocimiento = new SpeechRecognition();

      reconocimiento.lang = "es-ES";
      reconocimiento.continuous = false;
      reconocimiento.interimResults = false;

      boton.addEventListener("click", function () {

        resultado.textContent = "🎧 Escuchando...";

        boton.disabled = true;

        reconocimiento.start();

      });

      reconocimiento.onresult = async function (evento) {

        const mensaje =
          evento.results[0][0].transcript;

        resultado.textContent =
          "🤖 IJA está pensando...";

        try {

          const respuesta = await fetch(URL_APPS_SCRIPT, {

            method: "POST",

            headers: {
              "Content-Type": "text/plain;charset=utf-8"
            },

            body: JSON.stringify({
              mensaje: mensaje,
              sistema: "IJA"
            })

          });

          const datos = await respuesta.json();

          if (datos.success) {

            resultado.textContent =
              "🤖 IJA: " + datos.respuesta;

            hablar(datos.respuesta);

          } else {

            resultado.textContent =
              "IJA encontró un problema: " +
              (datos.error || "Error desconocido.");

          }

        } catch (error) {

          resultado.textContent =
            "Error de conexión con IJA: " +
            error.message;

        }

        boton.disabled = false;

      };

      reconocimiento.onerror = function (evento) {

        resultado.textContent =
          "Error del micrófono: " + evento.error;

        boton.disabled = false;

      };

      reconocimiento.onend = function () {

        boton.disabled = false;

      };

    }

    function hablar(texto) {

      if (!("speechSynthesis" in window)) {
        return;
      }

      window.speechSynthesis.cancel();

      const voz = new SpeechSynthesisUtterance(texto);

      voz.lang = "es-ES";
      voz.rate = 1;
      voz.pitch = 1;

      window.speechSynthesis.speak(voz);

    }

  </script>

</body>
    </html>
