<!DOCTYPE html><html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Next</title><style>
{
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
}

body {
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  color: #111827;
}

.app {
  width: 100%;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

.header {
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #111827;
  color: white;
  font-size: 24px;
  font-weight: bold;
}

.status {
  text-align: center;
  padding: 8px;
  background: #e5e7eb;
  color: #374151;
  font-size: 13px;
}

.chat {
  flex: 1;
  overflow-y: auto;
  padding: 18px;
}

.message {
  max-width: 85%;
  margin: 10px 0;
  padding: 13px 16px;
  border-radius: 18px;
  line-height: 1.45;
  word-break: break-word;
  white-space: pre-wrap;
}

.user {
  margin-left: auto;
  background: #111827;
  color: white;
  border-bottom-right-radius: 5px;
}

.ija {
  margin-right: auto;
  background: white;
  color: #111827;
  border-bottom-left-radius: 5px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}

.name {
  font-weight: bold;
  margin-bottom: 5px;
}

.input-area {
  padding: 12px;
  background: #f3f4f6;
  border-top: 1px solid #d1d5db;
}

.input-box {
  display: flex;
  align-items: center;
  gap: 8px;
  background: white;
  border-radius: 30px;
  padding: 6px;
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
}

#texto {
  flex: 1;
  min-width: 0;
  border: none;
  outline: none;
  padding: 12px;
  font-size: 16px;
  background: transparent;
}

button {
  border: none;
  cursor: pointer;
}

.microfono,
.enviar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: #111827;
  color: white;
}

.microfono {
  font-size: 21px;
}

.enviar {
  font-size: 20px;
}

.microfono.escuchando {
  background: #dc2626;
}

button:disabled {
  opacity: 0.45;
}

.bienvenida {
  text-align: center;
  margin: 30px auto;
  color: #6b7280;
}

.bienvenida h1 {
  margin-bottom: 8px;
  color: #111827;
}
</style></head><body><div class="app">  <div class="header">
    Next
  </div>  <div id="estado" class="status">
    IJA está iniciando...
  </div>  <div id="chat" class="chat"><div class="bienvenida">
  <h1>IJA</h1>
  <div>Israel Jacob Arizmendi</div>
</div>

  </div>  <div class="input-area"><div class="input-box">

  <button
    id="microfono"
    class="microfono"
    type="button"
    onclick="alternarMicrofono()"
  >🎙️</button>

  <input
    id="texto"
    type="text"
    placeholder="Escribe o habla con IJA..."
    autocomplete="off"
  >

  <button
    id="enviar"
    class="enviar"
    type="button"
    onclick="enviarMensaje()"
  >➤</button>

</div>

  </div></div><script>

const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbye3sx1VouZkoUsg3ixkIgvEbpKbiNqLs_tkA9IicNpq74PHJM4baP4jL6dWUqj7n-l/exec";

const texto = document.getElementById("texto");
const chat = document.getElementById("chat");
const enviar = document.getElementById("enviar");
const microfono = document.getElementById("microfono");
const estado = document.getElementById("estado");

let reconocimiento = null;
let escuchando = false;
let vocesDisponibles = [];

function cargarVoces() {
  if (!("speechSynthesis" in window)) {
    return;
  }

  vocesDisponibles = speechSynthesis.getVoices();
}

function seleccionarVoz() {
  if (!vocesDisponibles.length) {
    return null;
  }

  const vozEspanol = vocesDisponibles.find(function(voz) {
    return voz.lang &&
      voz.lang.toLowerCase().startsWith("es");
  });

  return vozEspanol || vocesDisponibles[0];
}

function hablar(mensaje) {
  if (!("speechSynthesis" in window)) {
    estado.textContent = "La voz no está disponible";
    return;
  }

  if (!mensaje) {
    return;
  }

  speechSynthesis.cancel();

  const voz = new SpeechSynthesisUtterance(mensaje);
  const vozSeleccionada = seleccionarVoz();

  if (vozSeleccionada) {
    voz.voice = vozSeleccionada;
  }

  voz.lang = "es-ES";
  voz.rate = 0.95;
  voz.pitch = 1;
  voz.volume = 1;

  voz.onstart = function() {
    estado.textContent = "IJA está hablando";
  };

  voz.onend = function() {
    estado.textContent = "IJA está listo";
  };

  voz.onerror = function() {
    estado.textContent = "IJA está listo";
  };

  speechSynthesis.speak(voz);
}

function saludoInicial() {
  const mensaje = "Hola. Soy IJA, Israel Jacob Arizmendi. Estoy listo para comunicarme contigo.";

  agregarMensaje(
    "IJA",
    mensaje,
    "ija"
  );

  hablar(mensaje);
}

function activarVozPorInteraccion() {
  const mensaje = "Hola. Soy IJA, Israel Jacob Arizmendi. Estoy listo para comunicarme contigo.";

  if (speechSynthesis.speaking) {
    return;
  }

  hablar(mensaje);
}

function agregarMensaje(nombre, mensaje, tipo) {
  const elemento = document.createElement("div");
  elemento.className = "message " + tipo;

  const nombreElemento = document.createElement("div");
  nombreElemento.className = "name";
  nombreElemento.textContent = nombre;

  const textoElemento = document.createElement("div");
  textoElemento.textContent = mensaje;

  elemento.appendChild(nombreElemento);
  elemento.appendChild(textoElemento);

  chat.appendChild(elemento);
  chat.scrollTop = chat.scrollHeight;

  return textoElemento;
}

async function enviarMensaje() {
  const mensaje = texto.value.trim();

  if (!mensaje) {
    return;
  }

  activarVozPorInteraccion();

  agregarMensaje(
    "Tú",
    mensaje,
    "user"
  );

  texto.value = "";

  enviar.disabled = true;
  microfono.disabled = true;

  estado.textContent = "IJA está pensando...";

  const respuestaElemento = agregarMensaje(
    "IJA",
    "Pensando...",
    "ija"
  );

  try {
    const respuestaHTTP = await fetch(
      URL_APPS_SCRIPT,
      {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify({
          mensaje: mensaje
        })
      }
    );

    if (!respuestaHTTP.ok) {
      throw new Error(
        "HTTP " + respuestaHTTP.status
      );
    }

    const datos = await respuestaHTTP.json();

    if (!datos.ok) {
      throw new Error(
        datos.mensaje || "Error del servidor."
      );
    }

    const respuesta = datos.respuesta || "";

    respuestaElemento.textContent = respuesta;

    estado.textContent = "IJA está conectado";

    hablar(respuesta);

  } catch (error) {
  console.error(error);

  respuestaElemento.textContent =
    error.message || "No pude conectarme con el motor.";

  estado.textContent =
    "Error del motor";
  }

  } finally {
    enviar.disabled = false;
    microfono.disabled = false;
    texto.focus();
  }
}

function prepararReconocimiento() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    estado.textContent =
      "IJA está listo para escribir";
    return;
  }

  reconocimiento =
    new SpeechRecognition();

  reconocimiento.lang = "es-ES";
  reconocimiento.continuous = false;
  reconocimiento.interimResults = false;
  reconocimiento.maxAlternatives = 1;

  reconocimiento.onstart = function() {
    escuchando = true;
    microfono.classList.add("escuchando");
    estado.textContent =
      "Te estoy escuchando...";
  };

  reconocimiento.onresult = function(event) {
    const resultado =
      event.results[0][0].transcript.trim();

    texto.value = resultado;

    enviarMensaje();
  };

  reconocimiento.onerror = function() {
    escuchando = false;
    microfono.classList.remove("escuchando");
    estado.textContent =
      "No pude escucharte.";
  };

  reconocimiento.onend = function() {
    escuchando = false;
    microfono.classList.remove("escuchando");

    if (
      estado.textContent ===
      "Te estoy escuchando..."
    ) {
      estado.textContent =
        "IJA está listo";
    }
  };
}

function alternarMicrofono() {
  activarVozPorInteraccion();

  if (!reconocimiento) {
    alert(
      "El reconocimiento de voz no está disponible."
    );
    return;
  }

  if (escuchando) {
    reconocimiento.stop();
    return;
  }

  try {
    reconocimiento.start();
  } catch (error) {
    console.error(error);
  }
}

texto.addEventListener(
  "keydown",
  function(event) {
    if (event.key === "Enter") {
      event.preventDefault();
      enviarMensaje();
    }
  }
);

document.addEventListener(
  "click",
  function() {
    activarVozPorInteraccion();
  },
  { once: true }
);

window.addEventListener(
  "load",
  function() {
    cargarVoces();

    if ("speechSynthesis" in window) {
      speechSynthesis.onvoiceschanged = function() {
        cargarVoces();
      };
    }

    prepararReconocimiento();

    estado.textContent =
      "IJA está listo";

    setTimeout(
      function() {
        saludoInicial();
      },
      500
    );
  }
);

</script></body>
</html>
