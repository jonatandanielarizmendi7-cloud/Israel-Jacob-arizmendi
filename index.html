<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Next</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #111111;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      border-bottom: 1px solid #dddddd;
    }

    #estado {
      padding: 10px 20px;
      text-align: center;
      font-size: 14px;
      color: #555555;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      box-sizing: border-box;
    }

    .mensaje {
      margin-bottom: 15px;
      line-height: 1.5;
    }

    .usuario {
      font-weight: bold;
    }

    .ija {
      font-weight: bold;
    }

    #controles {
      display: flex;
      gap: 10px;
      padding: 15px;
      border-top: 1px solid #dddddd;
      box-sizing: border-box;
    }

    #entrada {
      flex: 1;
      padding: 14px;
      font-size: 16px;
      border: 1px solid #cccccc;
      border-radius: 10px;
      outline: none;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 14px 18px;
      font-size: 16px;
      cursor: pointer;
    }

    #microfono {
      background: #eeeeee;
    }

    #enviar {
      background: #111111;
      color: #ffffff;
    }
  </style>
</head>

<body>

  <header>Next</header>

  <div id="estado">IJA está iniciando...</div>

  <main id="chat"></main>

  <div id="controles">
    <input
      id="entrada"
      type="text"
      placeholder="Escribe tu mensaje"
      autocomplete="off"
    >

    <button id="microfono" type="button">🎙️</button>

    <button id="enviar" type="button">Enviar</button>
  </div>

  <script>
    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycbye3sx1VouZkoUsg3ixkIgvEbpKbiNqLs_tkA9IicNpq74PHJM4baP4jL6dWUqj7n-l/exec";

    const chat = document.getElementById("chat");
    const entrada = document.getElementById("entrada");
    const enviar = document.getElementById("enviar");
    const microfono = document.getElementById("microfono");
    const estado = document.getElementById("estado");

    function agregarMensaje(nombre, texto, clase) {
      const elemento = document.createElement("div");
      elemento.className = "mensaje " + clase;

      const nombreElemento = document.createElement("span");
      nombreElemento.textContent = nombre + ": ";

      const textoElemento = document.createElement("span");
      textoElemento.textContent = texto;

      elemento.appendChild(nombreElemento);
      elemento.appendChild(textoElemento);

      chat.appendChild(elemento);
      chat.scrollTop = chat.scrollHeight;
    }

    function hablar(texto) {
      if (!("speechSynthesis" in window)) {
        return;
      }

      window.speechSynthesis.cancel();

      const voz = new SpeechSynthesisUtterance(texto);
      voz.lang = "es-ES";
      voz.rate = 1;
      voz.pitch = 1;

      window.speechSynthesis.speak(voz);
    }

    async function enviarMensaje() {
      const mensaje = entrada.value.trim();

      if (!mensaje) {
        return;
      }

      agregarMensaje("Tú", mensaje, "usuario");

      entrada.value = "";
      estado.textContent = "IJA está pensando...";

      try {
        const respuestaHTTP = await fetch(
          URL_APPS_SCRIPT,
          {
            method: "POST",
            headers: {
              "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify({
              mensaje: mensaje
            })
          }
        );

        const texto = await respuestaHTTP.text();

        let datos;

        try {
          datos = JSON.parse(texto);
        } catch (error) {
          throw new Error(
            "El servidor no devolvió una respuesta válida."
          );
        }

        if (!datos.ok) {
          throw new Error(
            datos.mensaje || "El motor no pudo responder."
          );
        }

        const respuesta = datos.respuesta || "";

        agregarMensaje("IJA", respuesta, "ija");
        hablar(respuesta);

        estado.textContent = "IJA está conectado.";

      } catch (error) {
        agregarMensaje(
          "IJA",
          error.message,
          "ija"
        );

        estado.textContent = "Error de conexión con el motor.";
      }
    }

    enviar.addEventListener(
      "click",
      enviarMensaje
    );

    entrada.addEventListener(
      "keydown",
      function(evento) {
        if (evento.key === "Enter") {
          enviarMensaje();
        }
      }
    );

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const reconocimiento =
        new SpeechRecognition();

      reconocimiento.lang = "es-ES";
      reconocimiento.continuous = false;
      reconocimiento.interimResults = false;

      reconocimiento.onstart = function() {
        estado.textContent = "Escuchando...";
      };

      reconocimiento.onresult = function(evento) {
        const texto =
          evento.results[0][0].transcript;

        entrada.value = texto;

        enviarMensaje();
      };

      reconocimiento.onerror = function() {
        estado.textContent =
          "No se pudo usar el micrófono.";
      };

      reconocimiento.onend = function() {
        estado.textContent =
          "IJA está listo.";
      };

      microfono.addEventListener(
        "click",
        function() {
          reconocimiento.start();
        }
      );

    } else {
      microfono.disabled = true;
      estado.textContent =
        "El reconocimiento de voz no está disponible.";
    }

    window.addEventListener(
      "load",
      function() {
        const saludo =
          "Hola. Soy IJA, Israel Jacob Arizmendi. Estoy listo para comunicarme contigo.";

        agregarMensaje(
          "IJA",
          saludo,
          "ija"
        );

        estado.textContent = "IJA está listo.";

        hablar(saludo);
      }
    );
  </script>

</body>
</html>
