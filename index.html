<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Israel Jacob Arizmendi</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
      margin: 0;
      background: #f5f5f5;
    }

    .contenedor {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
    }

    button {
      font-size: 18px;
      padding: 15px 25px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 20px;
    }

    #resultado {
      margin-top: 25px;
      min-height: 40px;
    }

    #estado {
      font-size: 14px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <h1>Israel Jacob Arizmendi</h1>

    <p>
      Hola. Soy Israel Jacob Arizmendi, tu inteligencia artificial.
    </p>

    <button id="botonHablar">
      🎙️ Hablar conmigo
    </button>

    <p id="resultado">
      Toca el botón y habla.
    </p>

    <p id="estado">
      Conectando con Firebase...
    </p>

  </div>

  <!-- Firebase -->
  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAnalytics
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-analytics.js";


    // Configuración de Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyCTAnfjfn-fMqkQpvOK-1kVcz03efGEbnM",
      authDomain: "israel-jacob-arizmendi.firebaseapp.com",
      projectId: "israel-jacob-arizmendi",
      storageBucket: "israel-jacob-arizmendi.firebasestorage.app",
      messagingSenderId: "337930506802",
      appId: "1:337930506802:web:61fa5a7ea1ee365060a22b",
      measurementId: "G-560KK3ZX8P"
    };


    // Inicializar Firebase
    const app = initializeApp(firebaseConfig);

    // Analytics
    const analytics = getAnalytics(app);

    document.getElementById("estado").textContent =
      "✅ Firebase está conectado correctamente.";


    // ==========================================
    // RECONOCIMIENTO DE VOZ
    // ==========================================

    const boton = document.getElementById("botonHablar");
    const resultado = document.getElementById("resultado");

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

      resultado.textContent =
        "Tu navegador no permite reconocimiento de voz.";

      boton.disabled = true;

    } else {

      const reconocimiento = new SpeechRecognition();

      reconocimiento.lang = "es-ES";
      reconocimiento.continuous = false;
      reconocimiento.interimResults = false;


      boton.addEventListener("click", () => {

        resultado.textContent =
          "🎙️ Te estoy escuchando...";

        reconocimiento.start();

      });


      reconocimiento.onresult = (evento) => {

        const texto =
          evento.results[0][0].transcript;

        resultado.textContent =
          "🤖 IJA: Te escuché correctamente: " + texto;

        hablar(
          "Te escuché correctamente."
        );

      };


      reconocimiento.onerror = (evento) => {

        resultado.textContent =
          "No pude escuchar correctamente. Inténtalo nuevamente.";

        console.log("Error de voz:", evento.error);

      };


      reconocimiento.onend = () => {

        console.log("Reconocimiento de voz terminado.");

      };

    }


    // ==========================================
    // VOZ DE IJA
    // ==========================================

    function hablar(texto) {

      if (!("speechSynthesis" in window)) {
        return;
      }

      const mensaje =
        new SpeechSynthesisUtterance(texto);

      mensaje.lang = "es-ES";
      mensaje.rate = 1;
      mensaje.pitch = 1;

      window.speechSynthesis.speak(mensaje);

    }

  </script>

</body>
</html>
