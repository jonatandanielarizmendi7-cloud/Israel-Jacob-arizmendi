<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Israel Jacob Arizmendi</title>
</head>

<body>
  <h1>Israel Jacob Arizmendi</h1>

  <p>Hola. Soy Israel Jacob Arizmendi, tu inteligencia artificial.</p>

  <button onclick="escuchar()">🎙️ Hablar conmigo</button>

  <p id="resultado">Toca el botón y habla.</p>

  <script>
    function escuchar() {
      const Reconocimiento = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!Reconocimiento) {
        hablar("Tu navegador no permite usar el reconocimiento de voz.");
        return;
      }

      const reconocimiento = new Reconocimiento();
alert("El micrófono está intentando activarse");
      reconocimiento.lang = "es-ES";
      reconocimiento.continuous = false;
      reconocimiento.interimResults = false;

      reconocimiento.onstart = function() {
        document.getElementById("resultado").textContent = "🎤 Te estoy escuchando...";
      };

      reconocimiento.onresult = function(event) {
        const texto = event.results[0][0].transcript;

        document.getElementById("resultado").textContent =
          "Tú dijiste: " + texto;

        hablar("Escuché que dijiste: " + texto);
      };

      reconocimiento.onerror = function(event) {
        document.getElementById("resultado").textContent =
          "No pude escucharte. Intenta nuevamente.";

        hablar("No pude escucharte. Intenta nuevamente.");
      };

      reconocimiento.start();
    }

    function hablar(texto) {
      const mensaje = new SpeechSynthesisUtterance(texto);
      mensaje.lang = "es-ES";
      speechSynthesis.speak(mensaje);
    }
  </script>
</body>
</html>
