<!DOCTYPE html><html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Next</title>  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #111111;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      border-bottom: 1px solid #dddddd;
    }

    #estado {
      padding: 10px;
      text-align: center;
      font-size: 14px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .mensaje {
      margin-bottom: 16px;
      line-height: 1.5;
    }

    #controles {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #dddddd;
    }

    #entrada {
      flex: 1;
      min-width: 0;
      padding: 13px;
      font-size: 16px;
      border: 1px solid #cccccc;
      border-radius: 10px;
      box-sizing: border-box;
    }

    button {
      padding: 13px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
    }

    #enviar {
      background: #111111;
      color: #ffffff;
    }
  </style></head><body>  <header>Next</header>  <div id="estado">IJA está iniciando...</div>  <main id="chat"></main>  <div id="controles">
    <input
      id="entrada"
      type="text"
      placeholder="Escribe tu mensaje"
      autocomplete="off"
    ><button id="microfono" type="button">🎙️</button>

<button id="enviar" type="button">Enviar</button>

  </div>  <script>
    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycbye3sx1VouZkoUsg3ixkIgvEbpKbiNqLs_tkA9IicNpq74PHJM4baP4jL6dWUqj7n-l/exec";

    const chat = document.getElementById("chat");
    const entrada = document.getElementById("entrada");
    const enviar = document.getElementById("enviar");
    const microfono = document.getElementById("microfono");
    const estado = document.getElementById("estado");

    function agregarMensaje(nombre, texto) {
      const elemento = document.createElement("div");
      elemento.className = "mensaje";

      const nombreElemento = document.createElement("strong");
      nombreElemento.textContent = nombre + ": ";

      const textoElemento = document.createElement("span");
      textoElemento.textContent = texto;

      elemento.appendChild(nombreElemento);
      elemento.appendChild(textoElemento);

      chat.appendChild(elemento);
      chat.scrollTop = chat.scrollHeight;
    }

    function hablar(texto) {
      if (!("speechSynthesis" in window)) {
        estado.textContent = "La voz no está disponible en este navegador.";
        return;
      }

      window.speechSynthesis.cancel();

      const voz = new SpeechSynthesisUtterance(texto);

      voz.lang = "es-ES";
      voz.rate = 1;
      voz.pitch = 1;
      voz.volume = 1;

      voz.onstart = function() {
        estado.textContent = "IJA está hablando...";
      };

      voz.onend = function() {
        estado.textContent = "IJA está listo.";
      };

      voz.onerror = function() {
        estado.textContent = "La voz tuvo un problema.";
      };

      window.speechSynthesis.speak(voz);
    }

    function saludoInicial() {
      const saludo =
        "Hola. Soy IJA, Israel Jacob Arizmendi. Estoy listo para comunicarme contigo.";

      agregarMensaje("IJA", saludo);

      setTimeout(function() {
        hablar(saludo);
      }, 500);
    }

    async function enviarMensaje() {
      const mensaje = entrada.value.trim();

      if (!mensaje) {
        return;
      }

      agregarMensaje("Tú", mensaje);

      entrada.value = "";

      estado.textContent = "IJA está pensando...";

      try {
        const respuestaHTTP = await fetch(
          URL_APPS_SCRIPT,
          {
            method: "POST",
            headers: {
              "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify({
              mensaje: mensaje
            })
          }
        );

        const texto = await respuestaHTTP.text();

        let datos;

        try {
          datos = JSON.parse(texto);
        } catch (error) {
          throw new Error(
            "Apps Script no devolvió JSON válido."
          );
        }

        if (!datos.ok) {
          throw new Error(
            datos.mensaje || "IJA no pudo responder."
          );
        }

        agregarMensaje("IJA", datos.respuesta);

        hablar(datos.respuesta);

      } catch (error) {
        agregarMensaje(
          "IJA",
          error.message
        );

        estado.textContent =
          "No se pudo conectar con el motor.";
      }
    }

    enviar.addEventListener(
      "click",
      enviarMensaje
    );

    entrada.addEventListener(
      "keydown",
      function(evento) {
        if (evento.key === "Enter") {
          enviarMensaje();
        }
      }
    );

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const reconocimiento =
        new SpeechRecognition();

      reconocimiento.lang = "es-ES";
      reconocimiento.continuous = false;
      reconocimiento.interimResults = false;

      reconocimiento.onstart = function() {
        estado.textContent = "Escuchando...";
      };

      reconocimiento.onresult = function(evento) {
        const texto =
          evento.results[0][0].transcript;

        entrada.value = texto;

        enviarMensaje();
      };

      reconocimiento.onerror = function() {
        estado.textContent =
          "No se pudo usar el micrófono.";
      };

      reconocimiento.onend = function() {
        if (
          estado.textContent === "Escuchando..."
        ) {
          estado.textContent = "IJA está listo.";
        }
      };

      microfono.addEventListener(
        "click",
        function() {
          try {
            reconocimiento.start();
          } catch (error) {
            reconocimiento.stop();

            setTimeout(function() {
              reconocimiento.start();
            }, 300);
          }
        }
      );
    } else {
      microfono.disabled = true;
      estado.textContent =
        "El reconocimiento de voz no está disponible.";
    }

    window.addEventListener(
      "load",
      function() {
        saludoInicial();
      }
    );
  </script></body>
</html>
