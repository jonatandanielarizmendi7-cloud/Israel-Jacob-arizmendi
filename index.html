<!DOCTYPE html><html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Israel Jacob Arizmendi</title>  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
      margin: 0;
      background: #f5f5f5;
      color: #222;
    }

    h1 {
      margin-bottom: 10px;
    }

    button {
      padding: 15px 25px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #222;
      color: white;
    }

    #resultado {
      margin-top: 25px;
      padding: 20px;
      background: white;
      border-radius: 12px;
      min-height: 50px;
    }
  </style></head><body>  <h1>Israel Jacob Arizmendi</h1>  <p>Prueba de voz de IJA</p><button id="hablar">🎙️ Hablar conmigo</button>

  <div id="resultado">
    Toca el botón y habla.
  </div>  <script>

    const boton = document.getElementById("hablar");
    const resultado = document.getElementById("resultado");

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

      resultado.textContent =
        "Tu navegador no permite reconocimiento de voz.";

      boton.disabled = true;

    } else {

      const reconocimiento = new SpeechRecognition();

      reconocimiento.lang = "es-ES";
      reconocimiento.continuous = false;
      reconocimiento.interimResults = false;

      boton.addEventListener("click", function() {

        resultado.textContent =
          "🎧 Escuchando... Habla ahora.";

        try {

          reconocimiento.start();

        } catch (error) {

          resultado.textContent =
            "No se pudo iniciar el micrófono: " +
            error.message;

        }

      });

      reconocimiento.onresult = function(evento) {

        const mensaje =
          evento.results[0][0].transcript;

        resultado.textContent =
          "IJA escuchó: " + mensaje;

        hablar(mensaje);

      };

      reconocimiento.onerror = function(evento) {

        resultado.textContent =
          "Error del micrófono: " +
          evento.error;

      };

      reconocimiento.onend = function() {

        boton.disabled = false;

      };

    }

    function hablar(texto) {

      if (!("speechSynthesis" in window)) {
        return;
      }

      window.speechSynthesis.cancel();

      const voz =
        new SpeechSynthesisUtterance(texto);

      voz.lang = "es-ES";
      voz.rate = 1;
      voz.pitch = 1;

      window.speechSynthesis.speak(voz);

    }

  </script>
  
  </body>
</html>
