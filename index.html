<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IJA — Israel Jacob Arizmendi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 90vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            overflow: hidden;
        }
        h1 {
            font-size: 1.5rem;
            color: #1a73e8;
            text-align: center;
            margin-top: 0;
        }
        #chat-log {
            flex-grow: 1;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 15px;
            background: #fafafa;
        }
        .mensaje {
            margin-bottom: 12px;
            padding: 8px 12px;
            border-radius: 8px;
            max-width: 85%;
            line-height: 1.4;
        }
        .usuario {
            background: #e3f2fd;
            color: #0d47a1;
            margin-left: auto;
            text-align: right;
        }
        .ija {
            background: #e8f5e9;
            color: #1b5e20;
            margin-right: auto;
        }
        .controles {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .input-grupo {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex-grow: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
        }
        button {
            padding: 12px 20px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
        }
        button:active {
            background-color: #1557b0;
        }
        #btn-voz {
            background-color: #34a853;
            width: 100%;
            font-size: 1.1rem;
        }
        #btn-voz.escuchando {
            background-color: #ea4335;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>IJA — Núcleo Operativo</h1>
        
        <div id="chat-log">
            <div class="mensaje ija">Hola. Soy IJA, Israel Jacob Arizmendi. Estoy listo para comunicarme contigo.</div>
        </div>

        <div class="controles">
            <button id="btn-voz" onclick="activarVoz()">🎙️ Hablar con IJA</button>
            <div class="input-grupo">
                <input type="text" id="input-texto" placeholder="Escribe tu mensaje aquí..." onkeypress="manejarEnter(event)">
                <button onclick="enviarMensajeTexto()">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        // URL de tu Apps Script configurada
        const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbwTyXy8__TYfmnh3rLldLCnB1qhqeEjtz9qKy8mpNhxrdMPrNk69JXZHhivZIhVVUqy/exec";

        function agregarAlChat(remitente, texto, clase) {
            const chatLog = document.getElementById('chat-log');
            const div = document.createElement('div');
            div.className = "mensaje " + clase;
            div.innerHTML = `<strong>${remitente}:</strong> ${texto}`;
            chatLog.appendChild(div);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        function hablarTexto(texto) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(texto);
                utterance.lang = 'es-ES';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        async function enviarAProtegido(prompt) {
            if (!prompt.trim()) return;

            agregarAlChat("Tú", prompt, "usuario");

            const chatLog = document.getElementById('chat-log');
            const cargandoDiv = document.createElement('div');
            cargandoDiv.className = "mensaje ija";
            cargandoDiv.id = "cargando-temp";
            cargandoDiv.innerHTML = `<em>IJA está pensando...</em>`;
            chatLog.appendChild(cargandoDiv);
            chatLog.scrollTop = chatLog.scrollHeight;

            try {
                const response = await fetch(URL_APPS_SCRIPT, {
                    method: "POST",
                    headers: {
                        "Content-Type": "text/plain;charset=utf-8"
                    },
                    body: JSON.stringify({ prompt: prompt })
                });

                const data = await response.json();
                
                document.getElementById('cargando-temp').remove();

                const respuestaIJA = data.resultado || data.error || "IJA no pudo responder.";
                agregarAlChat("IJA", respuestaIJA, "ija");
                hablarTexto(respuestaIJA);

            } catch (error) {
                const tempEl = document.getElementById('cargando-temp');
                if(tempEl) tempEl.remove();
                
                agregarAlChat("IJA", "No se pudo conectar con Apps Script. IJA no pudo responder", "ija");
                console.error(error);
            }
        }

        function enviarMensajeTexto() {
            const input = document.getElementById('input-texto');
            const texto = input.value;
            input.value = "";
            enviarAProtegido(texto);
        }

        function manejarEnter(event) {
            if (event.key === 'Enter') {
                enviarMensajeTexto();
            }
        }

        function activarVoz() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                alert("Tu navegador no soporta el reconocimiento de voz directo. Usa Google Chrome en Android.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            const btnVoz = document.getElementById('btn-voz');
            
            recognition.onstart = function() {
                btnVoz.classList.add('escuchando');
                btnVoz.textContent = "🎧 Escuchando...";
            };

            recognition.onspeechend = function() {
                recognition.stop();
            };

            recognition.onresult = function(event) {
                const textoTranscrito = event.results[0][0].transcript;
                enviarAProtegido(textoTranscrito);
            };

            recognition.onerror = function(event) {
                console.error("Error de voz: ", event.error);
                btnVoz.classList.remove('escuchando');
                btnVoz.textContent = "🎙️ Hablar con IJA";
            };

            recognition.onend = function() {
                btnVoz.classList.remove('escuchando');
                btnVoz.textContent = "🎙️ Hablar con IJA";
            };

            recognition.start();
        }
    </script>
</body>
</html>
